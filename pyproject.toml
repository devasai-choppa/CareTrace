[project]
name = "caretrace"
version = "0.1.0"
description = "CareTrace closes the loop between a healthcare price estimate and the actual bill."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CareTrace contributors" }]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "structlog>=24.1",
  "httpx>=0.27",
  "tenacity>=8.2",
  "ijson>=3.2",
  "pyarrow>=15.0",
  "polars>=0.20",
  "duckdb>=1.0",
  "dbt-core>=1.8,<2",
  "dbt-duckdb>=1.8,<2",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "pdfplumber>=0.11",
  "groq>=0.9",
  "jinja2>=3.1",
  "streamlit>=1.32",
  "plotly>=5.20",
  "pyyaml>=6.0",
  "rapidfuzz>=3.6",
  "rank-bm25>=0.2",
  "reportlab>=4.1",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "kuzu>=0.4",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
ml = ["lightgbm>=4.3", "splink>=4.0", "shap>=0.45"]
graph = ["kuzu>=0.4"]
vector = ["chromadb>=0.5"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
  "pre-commit>=3.7",
  "respx>=0.21",
  "types-PyYAML",
]

[project.scripts]
caretrace = "caretrace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caretrace"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["caretrace", "tests", "eval", "ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = false
exclude = ["dbt", "notebooks", "eval", "ui", "scripts"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "caretrace.agent.graph"
disable_error_code = ["type-var"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=caretrace --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "slow: large-file or end-to-end checks",
]

[tool.coverage.run]
source = ["caretrace"]
omit = [
  "caretrace/cli.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
